[package]
name = "local-dev-hub-menubar"
version = "0.2.0"
description = "Menu-bar companion for Local Dev Hub"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }

[profile.release]
strip = true
lto = true
